<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans Mono, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061320"/>
      <stop offset="0.55" stop-color="#103e66"/>
      <stop offset="1" stop-color="#081a2c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#2b86d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2b86d6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.1" cy="0.92" r="0.5">
