  <text x="80" y="416" font-size="78" font-weight="bold" fill="#ffb454">&#8594; </text>
  <text x="158" y="416" font-size="78" font-weight="bold" fill="#ff6b6b" opacity="0.38">canceled</text>
  <text x="158" y="416" font-size="78" font-weight="bold" fill="#ff7d7d">canceled</text>

  <text x="82" y="540" font-size="26" fill="#8fb2cf">the replica replays history; you are in the way.</text>
